services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storytoon
      POSTGRES_PASSWORD: storytoon
      POSTGRES_DB: storytoon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d
volumes:
  pgdata:
